[tox]
envlist = py{311,312,313,314,315}
skipsdist = {env:TOXBUILD:false}

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315

[testenv]
deps= -rrequirements-test.txt
passenv = PYENV_VERSION
commands=
    {env:TOXBUILD:pytest} --basetemp={envtmpdir} test {posargs}

[pytest]
addopts = -x -v --full-suite --no-rebuild
