name: amitools GH Test

on:
  - push
  - pull_request

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Install ruff
      run: python -m pip install ruff
    - name: Check formatting
      run: ruff format --check .
    - name: Lint
      # Non-blocking: the codebase still has a backlog of pre-existing
      # lint warnings that is being worked down separately.
      continue-on-error: true
      run: ruff check .
    - name: Check fixture blob manifest
      # Every file in test/blob_files.txt must be git-ignored so copyrighted
      # AmigaOS fixtures can never be committed by accident.
      run: test/blob_check.sh

  windows-disk:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Install disk test dependencies
      run: python -m pip install pytest greenlet
    - name: Test disk locking and device compatibility
      run: python -m pytest test/unit/fs_imagefile.py test/unit/disk_session.py test/unit/disk_partition_lock.py test/unit/lib_scsi_device.py test/unit/util_win32disk.py test/unit/util_win32disk_volumes.py

  build:
    runs-on: ${{ matrix.platform }}
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox tox-gh-actions
    - name: Install zstd
      run: |
        if command -v zstd >/dev/null 2>&1; then
          zstd --version
        elif [ "$RUNNER_OS" = "macOS" ]; then
          brew install zstd
        else
          sudo apt-get update && sudo apt-get install -y zstd
        fi
    - name: Restore encrypted fixtures
      # Copyrighted AmigaOS fixtures (currently ARexx) are not committed; they
      # are restored from test/blob.tar.zstd.enc using the BLOB_PASSPHRASE
      # secret.  Fork PRs do not get secrets, so the step is skipped there and
      # the tests that need the fixtures skip themselves.
      env:
        BLOB_PASSPHRASE: ${{ secrets.BLOB_PASSPHRASE }}
      run: |
        if [ -z "$BLOB_PASSPHRASE" ]; then
          echo "BLOB_PASSPHRASE secret not set; fixtures stay absent"
          exit 0
        fi
        test/blob_decode.sh
    - name: Test with tox
      run: tox -vvv
      env:
        PLATFORM: ${{ matrix.platform }}
