name: amitools GH Test

on:
  - push
  - pull_request

jobs:
  windows-disk:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    - name: Install disk test dependencies
      run: python -m pip install pytest greenlet
    - name: Test disk locking and device compatibility
      run: python -m pytest test/unit/fs_imagefile.py test/unit/disk_session.py test/unit/lib_scsi_device.py

  build:
    runs-on: ${{ matrix.platform }}
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox tox-gh-actions
    - name: Test with tox
      run: tox -vvv
      env:
        PLATFORM: ${{ matrix.platform }}
